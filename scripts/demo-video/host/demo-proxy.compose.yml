# demo-proxy beside the demo instance (docs/296 plan §2, §9). Its own Compose
# project: the local install's lib.sh only ever adds the fixed tailnet overlay,
# so a sibling cannot be an overlay of `shipit-prod`. The service joins the
# instance's network by name; session containers reach it as `demo-proxy`.
#
# Host layout (services:~/shipit-demo/): this file, proxy.mjs,
# demo-proxy-entrypoint.sh, cassettes/, and a `.env` holding the DEMO_PROXY_*
# knobs below. The key lives in /root/shipit-demo-proxy.env (root, 0600), so
# every compose invocation runs under sudo:
#   sudo docker compose -f ~/shipit-demo/demo-proxy.compose.yml up -d --force-recreate demo-proxy
name: shipit-demo

services:
  demo-proxy:
    # Same digest as docker/Dockerfile.prod and the session-worker image.
    image: node:24-slim@sha256:4e6b70dd6cbfc88c8157ba19aa3d9f9cce6ba4703576d55459e45efcbc9c5f5d
    init: true
    user: "${DEMO_PROXY_UID:-1000}:${DEMO_PROXY_GID:-1000}"
    entrypoint: ["/bin/sh", "/app/demo-proxy-entrypoint.sh"]
    environment:
      DEMO_PROXY_MODE: ${DEMO_PROXY_MODE:-replay}
      DEMO_PROXY_CASSETTE: ${DEMO_PROXY_CASSETTE:-/cassettes/dogfood-smoke}
      DEMO_PROXY_UPSTREAM: ${DEMO_PROXY_UPSTREAM:-https://api.anthropic.com}
      DEMO_PROXY_PACE: ${DEMO_PROXY_PACE:-120}
    env_file:
      - /root/shipit-demo-proxy.env
    volumes:
      - ./proxy.mjs:/app/proxy.mjs:ro
      - ./demo-proxy-entrypoint.sh:/app/demo-proxy-entrypoint.sh:ro
      - ./cassettes:/cassettes
    networks:
      - shipit-prod
    restart: unless-stopped

networks:
  shipit-prod:
    external: true
