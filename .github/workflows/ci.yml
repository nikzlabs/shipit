name: CI

# One CI workflow for every code path into the repo — PRs and the branches they
# land on. There used to be a second workflow (`main-ci.yml`) that existed only
# because PRs ran on self-hosted runners while post-merge validation ran on
# GitHub-hosted ones. This repository is public, so GitHub-hosted runners are
# free and unmetered; the self-hosted fleet bought nothing and cost a second
# copy of the gates that could silently drift from this one. Everything now runs
# on `ubuntu-24.04`, so one workflow covers both triggers.
on:
  pull_request:
    # `main` is the integration branch; `stable` is the release maintenance
    # branch (docs/162/214). Run the gates on PRs into either so a release-bump
    # PR into `stable` gets a green check before merge — the same gates the
    # post-merge release.yml run re-runs to gate the publish.
    branches: [main, stable]
    # NOTE: deliberately NO `paths-ignore` here. These jobs are *required* status
    # checks in branch protection, and GitHub treats a trigger-level path skip
    # (paths-ignore) as a check that never reports — it sits "Expected / pending"
    # and blocks the PR from merging forever. A *job-level* `if:` skip, by
    # contrast, reports "success" and satisfies the requirement. So docs-only
    # changes are short-circuited at the job level (see the `changes` job +
    # `needs: changes` gating below), not by filtering the trigger.
  # Post-merge validation for every commit that lands on the integration branch.
  # A PR is tested against its merge base; this catches semantic conflicts
  # between two PRs that were each green on their own.
  push:
    branches: [main]

# Cancel superseded runs. When a PR branch is pushed again before its CI
# finishes, the in-flight run is now wasted work — every new push used to start
# a fresh full run while the old one kept burning minutes to completion. Keying
# the group on the PR ref (head_ref on a pull_request, the branch ref on a push)
# and cancelling in progress means only the latest commit's run survives. The
# release/tag workflow has no such group — a published tag's run must never be
# cancelled.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Belt-and-suspenders: force any JavaScript actions still on Node.js 20 to
# run on Node.js 24. Our actions are pinned at v5 (which already use Node 24),
# but this guards against transitive uses by composite actions.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Cheap gate that decides whether the build-affecting jobs need to run. Lists
  # the files a PR changes vs its base; if every one is a doc/markdown file, the
  # heavy jobs below skip (and a skipped *job* reports "success", keeping a
  # docs-only PR mergeable under branch protection). A release-bump PR touches
  # package.json / package-lock.json (not docs), so it always runs the gates.
  # Pure git — no third-party action — to keep the dependency surface pinned.
  #
  # On a `push` (post-merge) there is no PR base to diff against and the run is
  # the last word on what landed, so the gates always run.
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "Not a pull request — running the full gates."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          echo "Changed files:"
          echo "$changed"
          if [ -z "$changed" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$changed" | grep -qvE '(^docs/|\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Lint, Type Check & Build
    needs: changes
    # Only when the change touches build-affecting files (docs-only PRs skip).
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # Cache node_modules itself, keyed on the lockfile. On a hit we skip the
      # extract/link work `npm ci` does even with a warm ~/.npm download cache
      # (setup-node's `cache: npm` only caches the tarballs, not the installed
      # tree). The key includes the runner image and the Node major so either
      # bump busts it — installed trees contain native binaries and platform
      # specific optional deps, so they are only portable within one image.
      - uses: actions/cache@v5
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-ubuntu24-node24-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check-deps
      - run: npm run build

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v5
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-ubuntu24-node24-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm test
