services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile.dogfood
      args:
        # Match onboarding: both builds share one image tag.
        SHIPIT_HARNESSES: claude,codex,opencode,grok
    image: shipit-dogfood:local
    # Inherit the session UID for git ownership; share agent.install output.
    command: >
      sh -c "
      mkdir -p $${SHIPIT_STATE_DIR:-/workspace/.inner-shipit} $${AGENT_HOME:-/root} &&
      while [ ! -x node_modules/.bin/vite ]; do
        echo '[dev] waiting for agent.install to populate node_modules…'; sleep 1;
      done &&
      PORT=4000 npm run dev &
      ( npx tsx scripts/seed-inner.ts 2>&1 | sed 's/^/[seed] /' &) &&
      API_PORT=4000 exec npx vite --host 0.0.0.0 --port 3000
      "
    working_dir: /workspace
    init: true
    environment:
      RUNTIME_MODE: local
      # Both homes must be writable by the inherited session UID.
      AGENT_HOME: /workspace/.inner-shipit/agent-home
      HOME: /workspace/.inner-shipit/agent-home
      WORKSPACE_DIR: /workspace
      SHIPIT_STATE_DIR: /workspace/.inner-shipit
      CHOKIDAR_USEPOLLING: "1"
      CHOKIDAR_INTERVAL: "1000"
      # Overlayfs cannot rename lower-layer optimizer cache directories.
      VITE_CACHE_DIR: /workspace/.inner-shipit/vite-cache
    volumes:
      - .:/workspace
    ports:
      - "3000:3000"
    x-shipit-preview: manual
    # Supplied metered keys can also fund unpinned background work.
    x-shipit-secrets:
      - { name: GITHUB_TOKEN }
      - { name: ANTHROPIC_AUTH_TOKEN }
      - { name: ANTHROPIC_API_KEY }
      - { name: OPENAI_API_KEY }
      - { name: DEEPSEEK_API_KEY }
      - { name: ZAI_CODING_PLAN_KEY }
      - { name: ZAI_API_KEY }
      - { name: OPENROUTER_API_KEY }
      - { name: VERCEL_AI_GATEWAY_API_KEY }
      - { name: OPENCODE_ZEN_API_KEY }
      - { name: OPENCODE_GO_KEY }
      - { name: XAI_API_KEY, agent: true }

  # Keep service credentials absent so first-run onboarding remains reachable.
  onboarding:
    build:
      context: .
      dockerfile: docker/Dockerfile.dogfood
      args:
        SHIPIT_HARNESSES: claude,codex,opencode,grok
    image: shipit-dogfood:local
    command: >
      sh -c "
      mkdir -p $${SHIPIT_STATE_DIR:-/workspace/.inner-shipit/onboarding} $${AGENT_HOME:-/root} &&
      while [ ! -x node_modules/.bin/vite ]; do
        echo '[onboarding] waiting for agent.install to populate node_modules…'; sleep 1;
      done &&
      PORT=4001 npm run dev &
      API_PORT=4001 exec npx vite --host 0.0.0.0 --port 3001
      "
    working_dir: /workspace
    init: true
    environment:
      RUNTIME_MODE: local
      WORKSPACE_DIR: /workspace
      SHIPIT_STATE_DIR: /workspace/.inner-shipit/onboarding
      AGENT_HOME: /workspace/.inner-shipit/onboarding/agent-home
      HOME: /workspace/.inner-shipit/onboarding/agent-home
      VITE_CACHE_DIR: /workspace/.inner-shipit/onboarding/vite-cache
      CHOKIDAR_USEPOLLING: "1"
      CHOKIDAR_INTERVAL: "1000"
      DOGFOOD_SEED: "0"
    volumes:
      - .:/workspace
    ports:
      - "3001:3001"
    x-shipit-preview: manual
    x-shipit-secrets:
      - { name: GITHUB_TOKEN }

  # Tests the SDK bootstrap from this checkout through the real preview proxy.
  sdk-test:
    image: node:24-slim
    working_dir: /workspace
    init: true
    command: >
      sh -c "
      while [ ! -x node_modules/.bin/tsx ]; do
        echo '[sdk-test] waiting for agent.install to populate node_modules…'; sleep 1;
      done &&
      exec node --import tsx test-preview/server.ts
      "
    environment:
      PORT: "3002"
    volumes:
      - .:/workspace
    ports:
      - "3002:3002"
    x-shipit-preview: manual

  emulator:
    image: budtmo/docker-android:emulator_14.0
    # Use the image's own numeric UID; its startup files reject the session UID.
    user: "1300:1301"
    environment:
      - WEB_VNC=true
      - EMULATOR_DEVICE=Samsung Galaxy S10
    devices:
      - "/dev/kvm:/dev/kvm"
    ports:
      - "6080:6080"
    expose:
      - "5555"
    depends_on:
      - android
    x-shipit-preview: manual

  android:
    build:
      context: .
      dockerfile: docker/Dockerfile.android-dev
    image: shipit-android-dev:local
    working_dir: /workspace/android-snapshot-test
    init: true
    environment:
      HOME: /workspace/.android-home
      GRADLE_USER_HOME: /workspace/.gradle-android
    volumes:
      - .:/workspace
    command: ["bash", "/workspace/docker/android-hot-reload.sh"]
