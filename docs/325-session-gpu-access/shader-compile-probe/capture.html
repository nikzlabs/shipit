<!doctype html>
<meta charset="utf-8">
<title>capture three.js shader sources</title>
<canvas id="c" width="480" height="320"></canvas>
<script type="importmap">{ "imports": { "three": "./package/build/three.module.js" } }</script>
<script type="module">
// Hook the context before three.js makes it, and record the source pair of each linked program.
const src = new WeakMap(), kinds = new WeakMap(), attached = new WeakMap();
const P = WebGL2RenderingContext.prototype;
const pairs = [];
const cs = P.createShader; P.createShader = function (t) { const s = cs.call(this, t); kinds.set(s, t); return s; };
const ss = P.shaderSource; P.shaderSource = function (s, text) { src.set(s, text); return ss.call(this, s, text); };
const as = P.attachShader; P.attachShader = function (p, s) { (attached.get(p) ?? attached.set(p, []).get(p)).push(s); return as.call(this, p, s); };
const lp = P.linkProgram; P.linkProgram = function (p) {
  const list = attached.get(p) ?? [];
  const vs = list.find((s) => kinds.get(s) === this.VERTEX_SHADER), fs = list.find((s) => kinds.get(s) === this.FRAGMENT_SHADER);
  pairs.push({ vs: src.get(vs), fs: src.get(fs) });
  return lp.call(this, p);
};

const THREE = await import("three");
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: false });
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x8899aa, 5, 60);
const camera = new THREE.PerspectiveCamera(50, 1.5, 0.1, 100);
camera.position.set(0, 4, 14);

const tex = (r, g, b) => { const t = new THREE.DataTexture(new Uint8Array([r, g, b, 255]), 1, 1); t.needsUpdate = true; return t; };
const cube = new THREE.CubeTexture(Array.from({ length: 6 }, () => { const c = document.createElement("canvas"); c.width = c.height = 16; const x = c.getContext("2d"); x.fillStyle = "#89a"; x.fillRect(0, 0, 16, 16); return c; }));
cube.needsUpdate = true;
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromCubemap(cube).texture;

const dir = new THREE.DirectionalLight(0xffffff, 2); dir.position.set(5, 10, 5); dir.castShadow = true; scene.add(dir);
const spot = new THREE.SpotLight(0xffeedd, 30); spot.position.set(-6, 8, 4); spot.castShadow = true; scene.add(spot);
scene.add(new THREE.PointLight(0x88aaff, 20), new THREE.HemisphereLight(0xbbccff, 0x443322, 1), new THREE.AmbientLight(0x222222));

const maps = { map: tex(200, 180, 160), normalMap: tex(128, 128, 255), roughnessMap: tex(0, 128, 0), metalnessMap: tex(0, 0, 128), aoMap: tex(255, 255, 255), emissiveMap: tex(10, 10, 10) };
const mats = [
  new THREE.MeshStandardMaterial({ ...maps }),
  new THREE.MeshStandardMaterial({ map: maps.map, transparent: true, opacity: 0.8, side: THREE.DoubleSide }),
  new THREE.MeshStandardMaterial({ normalMap: maps.normalMap, flatShading: true, vertexColors: true }),
  new THREE.MeshPhysicalMaterial({ ...maps, clearcoat: 1, clearcoatRoughness: 0.2, sheen: 1, iridescence: 1 }),
  new THREE.MeshPhysicalMaterial({ map: maps.map, transmission: 1, thickness: 1, ior: 1.4, anisotropy: 0.5 }),
  new THREE.MeshPhongMaterial({ map: maps.map, normalMap: maps.normalMap, specularMap: maps.roughnessMap }),
  new THREE.MeshLambertMaterial({ map: maps.map, emissiveMap: maps.emissiveMap }),
  new THREE.MeshToonMaterial({ map: maps.map }),
  new THREE.MeshBasicMaterial({ map: maps.map, envMap: cube, alphaTest: 0.5 }),
  new THREE.MeshMatcapMaterial({ matcap: maps.map }),
  new THREE.MeshNormalMaterial(),
];
const geo = new THREE.TorusKnotGeometry(0.6, 0.2, 48, 8);
geo.setAttribute("color", new THREE.BufferAttribute(new Float32Array(geo.attributes.position.count * 3).fill(1), 3));
mats.forEach((m, i) => { const mesh = new THREE.Mesh(geo, m); mesh.position.set((i % 6) * 2 - 5, Math.floor(i / 6) * 2, 0); mesh.castShadow = mesh.receiveShadow = true; scene.add(mesh); });
const inst = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({ ...maps }), 4);
for (let i = 0; i < 4; i++) inst.setMatrixAt(i, new THREE.Matrix4().makeTranslation(i * 2 - 3, 5, -2));
inst.castShadow = true; scene.add(inst);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x556655 })); ground.rotation.x = -Math.PI / 2; ground.position.y = -1; ground.receiveShadow = true; scene.add(ground);
scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.05, map: maps.map })));
scene.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0xffffff })));
scene.add(new THREE.Sprite(new THREE.SpriteMaterial({ map: maps.map })));

renderer.render(scene, camera);
renderer.render(scene, camera);
window.__pairs = pairs;
window.__done = true;
</script>
