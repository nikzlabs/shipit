agent:
  # A bare command lets the worker apply its download-cache options.
  install: npm install
compose: docker-compose.yml
issues:
  trackers:
    - kind: github
      repo: nikzlabs/shipit-planning
      name: planning
      label: Planning
exports:
  plugins:
    probe:
      compose: test-plugin/docker-compose.yml
      cli:
        probe: test-plugin/cli/probe.mjs
      skills: test-plugin/skills
      install: node test-plugin/install.mjs
      install-inputs: [test-plugin/install.mjs]
      credentials: [PROBE_TOKEN]
      hosts: [{ name: example.com, optional: true }]
      settings:
        greeting:
          description: Text the probe service and CLI echo back
          default: hello from the probe
plugins:
  repos:
    - repo: self
      name: shipit-dev
  use:
    - plugin: probe
      from: shipit-dev
      overrides:
        settings:
          greeting: hello from the consuming project
        services:
          probe:
            autostart: false
release:
  mechanism: release-branch
  branch: stable
  version-source: package.json
