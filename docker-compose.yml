# ShipIt-in-ShipIt (feature 118 — dogfooding mode).
#
# When the ShipIt repo is opened in production ShipIt, the outer orchestrator
# starts this Compose stack as a session-scoped service. The `dev` service
# runs an *inner* orchestrator with RUNTIME_MODE=local, so it can serve the
# ShipIt UI from inside the outer session container without trying to spawn
# Docker containers of its own (which it can't — there's no nested Docker).
#
# The outer ShipIt picks up this service when the user starts it manually
# (because of the `x-shipit-preview: manual` marker), and the preview panel
# renders the inner UI on port 3000. The dogfooding inner orch is heavy
# (npm install + vite build + a second orch process), so we don't pay that
# cost on every session — it boots only when the user explicitly starts it.
#
# See docs/118-shipit-ui-local/plan.md for the full design.
services:
  dev:
    # Built from docker/Dockerfile.dogfood — a thin node:24 + agent-CLIs image.
    # It no longer bakes node_modules: the `dev` service shares the agent
    # container's bind-mounted /workspace/node_modules (populated by
    # `agent.install`) instead of carrying its own copy. See the volumes and
    # command notes below, and feature 137 (docs/137-depends-on-install) for
    # the "share the install output instead of re-installing" rationale.
    #
    # `image:` names the build output so Compose can reuse it across stack
    # restarts. The first session on a given outer host pays the build cost
    # once; subsequent sessions hit the Docker layer cache and start fast.
    build:
      context: .
      dockerfile: docker/Dockerfile.dogfood
    image: shipit-dogfood:local
    # No `npm install` here anymore. The `dev` service now shares the agent
    # container's /workspace/node_modules (see volumes below), which
    # `agent.install` populates at session boot — so the deps are already in
    # place by the time the user manually starts this heavyweight service.
    # Running our own `npm install` would be both redundant AND unsafe: it
    # would write the *shared* tree concurrently with `agent.install`, which
    # is the tarball-extraction corruption race the old per-service
    # node_modules volume existed to avoid (feature 137 is the broader
    # "depend on install instead of racing it" move).
    #
    # 137's declarative gate (`x-shipit-depends-on-install`) only auto-applies
    # to `x-shipit-preview: auto` services — it does NOT cover this `manual`
    # service (`ServiceManager.startService` starts manual services on demand
    # without consulting the gate). So instead of the gate we use a tiny
    # wait-for-deps guard: block until `node_modules/.bin/vite` exists before
    # launching. In the common case agent.install finished long ago and this
    # is an instant check; it only ever waits if the user starts `dev` during
    # the brief boot-time install window.
    #
    # `mkdir -p` ensures SHIPIT_STATE_DIR exists before the inner orch
    # tries to open its SQLite db there (DatabaseManager doesn't create
    # parent dirs). Required because `.inner-shipit/` is in .gitignore
    # and won't exist on a fresh checkout.
    #
    # The agent CLIs (claude / codex) are NOT installed here — they're baked
    # into Dockerfile.dogfood. ServiceManager runs `docker compose up -d
    # --build`, so a changed Dockerfile.dogfood is always rebuilt and the
    # bake can't go stale on a host with an old cached `shipit-dogfood:local`.
    # See "Agent CLIs must be baked into the dev image" in
    # docs/118-shipit-ui-local/plan.md.
    #
    # Dev-mode wiring: Vite's dev server runs on the exposed port 3000
    # (so the outer preview proxy reaches it directly) and the inner
    # orchestrator runs on internal port 4000. Vite proxies `/api`,
    # `/ws`, and `/preview` to the orchestrator using `API_PORT=4000`
    # (see `vite.config.ts`). This gives real HMR through the outer
    # preview proxy (which already patches dev-server WS URLs in
    # `preview-proxy.ts`) — client edits hot-reload instead of
    # requiring a `vite build` round-trip.
    #
    # The seed step (docs/131) adds and trusts the repos in
    # `scripts/dogfood-seed.json` so the inner ShipIt comes up with something
    # to work in instead of an empty slate. It is backgrounded and detached
    # (`( … &)`) so Vite starts immediately and the inner UI is usable while
    # the clones land; it waits for the orch itself, exits 0 on any failure,
    # skips repos that are already present, and no-ops on DOGFOOD_SEED=0.
    command: >
      sh -c "
      mkdir -p $${SHIPIT_STATE_DIR:-/workspace/.inner-shipit} $${AGENT_HOME:-/root} &&
      while [ ! -x node_modules/.bin/vite ]; do
        echo '[dev] waiting for agent.install to populate node_modules…'; sleep 1;
      done &&
      PORT=4000 npm run dev &
      (node scripts/seed-inner-sessions.js 2>&1 | sed 's/^/[seed] /' &) &&
      API_PORT=4000 exec npx vite --host 0.0.0.0 --port 3000
      "
    working_dir: /workspace
    # `init: true` enables a tini-style PID 1 so orphaned agent CLI
    # subprocesses are reaped. In containerized mode the kernel-level
    # cleanup handles this when the session container is destroyed; in
    # local mode the inner orch is the parent of every agent subprocess
    # and `init` is the safety net.
    init: true
    environment:
      RUNTIME_MODE: local
      # docs/150 §9 — local mode hosts agent processes in-process, so agentHome()
      # (default /home/shipit, a user this image doesn't have) has to be pinned
      # to something the runtime user can actually write.
      #
      # This used to be `/root`, on the premise that local mode "keeps the
      # orchestrator on root". That stopped being true: with
      # SHIPIT_SESSION_WORKER_UID set on the deployment, `compose-generator`
      # forces `user: <uid>:<uid>` onto every service without an explicit
      # `user:` — including this one. So the inner orch runs as uid 1000 against
      # HOME=/root and every credential write failed with
      # `EACCES: permission denied, lstat '/root/.codex'` (SHI-282).
      #
      # The state dir is the natural home: bind-mounted, owned by the same uid,
      # already gitignored, and it survives a service restart. Kept out of
      # Dockerfile.dogfood's ENV on purpose — the image can't know the mount
      # path, so compose is the only place that can be right.
      AGENT_HOME: /workspace/.inner-shipit/agent-home
      # Note: the orchestrator's PORT (4000) and Vite's port (3000) are set
      # inline in the `command:` above, not here, because we run two
      # processes with different ports inside this single service.
      #
      # Inner-orch's notion of "the workspace the user is editing." This
      # is the bind-mounted source tree below.
      WORKSPACE_DIR: /workspace
      # Move the inner orch's SQLite db, repo-cache, and dep-cache OUT of
      # the visible workspace so they don't pollute the outer agent's view
      # of the source tree (and don't get auto-committed). `.inner-shipit/`
      # is in .gitignore.
      SHIPIT_STATE_DIR: /workspace/.inner-shipit
      # Force chokidar (used by both `tsx watch` for the server and
      # `vite build --watch` for the client) to use polling instead of
      # inotify. Without this, chokidar creates one inotify instance per
      # watched source file (~300+ files), which blows past the kernel's
      # `fs.inotify.max_user_instances` limit (commonly 128 on Linux
      # hosts) and crashes the dev server with:
      #   ENOSPC: System limit for number of file watchers reached
      # Polling avoids inotify entirely; the 1s interval keeps CPU low
      # while still feeling live. This also tends to be more reliable on
      # Docker bind-mounts, where inotify events propagating from the
      # host filesystem can be lossy depending on the host platform.
      CHOKIDAR_USEPOLLING: "1"
      CHOKIDAR_INTERVAL: "1000"
      # Move Vite's dep-optimizer cache OFF the overlayfs `node_modules`.
      #
      # Committing an optimizer run renames directories inside the cache dir
      # (`deps` → `deps_temp_<hash>`, then the processing dir → `deps`), and
      # overlayfs refuses to rename a directory that still lives in its lower
      # layer — `EXDEV: cross-device link not permitted`, despite both paths
      # being on one device. `node_modules` here is exactly that: the docs/183
      # overlay dep store, a shared read-only base plus a per-session upper.
      # Vite has no fallback for that rename, so re-optimization failed in a
      # loop and the inner dev server served no client at all. Any lockfile
      # change re-triggers optimization, so a rebase was enough to hit it.
      #
      # The state dir is plain ext4 (it is a bind mount, not the overlay),
      # already gitignored, and survives a service restart — so both sides of
      # those renames land on one ordinary filesystem. `vite.config.ts` reads
      # this and otherwise leaves Vite's default alone.
      VITE_CACHE_DIR: /workspace/.inner-shipit/vite-cache
    volumes:
      # Required: without this, /workspace inside the dev container is
      # empty. Bind-mounting the outer session's workspace lets the inner
      # orch see (and edit) the live ShipIt source — INCLUDING
      # /workspace/node_modules, which is now shared with the agent container
      # rather than shadowed by a per-service volume.
      #
      # Why the old anonymous `- /workspace/node_modules` volume is gone:
      #   1. Concurrent-write corruption — the only thing that wrote the
      #      shared tree from this side was the in-command `npm install`,
      #      which we removed. With the dev service no longer installing,
      #      `agent.install` is the sole writer and there's no race.
      #   2. ABI mismatch — the dev image was Node 22 vs the agent's Node 24,
      #      so a shared tree's native modules wouldn't load. The dev image is
      #      now pinned to the SAME node:24 digest as the agent container
      #      (docker/Dockerfile.dogfood), so the agent-built better-sqlite3 /
      #      node-pty binaries load fine here.
      # Sharing the tree drops ~600MB of duplicate deps and a duplicate
      # install per session.
      - .:/workspace
    ports:
      - "3000:3000"
    # Tells the outer orchestrator to surface this service in the preview
    # panel, but only start it when the user explicitly requests it. The
    # inner orch is heavyweight (npm install + vite build + a second orch
    # process), so we don't pay that cost on every session boot. Once
    # started, the outer's preview proxy routes
    # `<sessionId>--3000.localhost` to this container.
    x-shipit-preview: manual
    # The inner orch's AuthManager / GitHubAuthManager init from process.env,
    # so the inner UI is logged in from the start. These are user-supplied
    # secrets: the dogfooding developer sets them once in the outer ShipIt's
    # Settings → Secrets panel, keyed by these names. Use a long-lived
    # ANTHROPIC_API_KEY (it does not rotate) + a dedicated testing GITHUB_TOKEN.
    x-shipit-secrets:
      - { name: ANTHROPIC_API_KEY }
      - { name: ANTHROPIC_AUTH_TOKEN }
      - { name: GITHUB_TOKEN }

  # Agent Interface SDK test preview (docs/242).
  #
  # A ~40-line static server whose page reports the live state of `window.shipit`
  # — installed? handshake resolved? visibility? — and can send a real message to
  # this session's agent. It exists because the SDK's Preview path can only be
  # exercised through an actual proxied service: the bootstrap is injected by
  # `preview-proxy.ts` into a cross-origin iframe, which no unit test reproduces.
  # Both bugs it caught (a `__name` reference that killed the script under the
  # production tsx transform, and a `document.referrer`-derived parent origin that
  # broke after any in-preview navigation) were invisible from the client bundle.
  #
  # Manual, like `dev` — it's cheap to run but it would otherwise claim the
  # preview pane on every session. Start it with `shipit service start sdk-test`.
  #
  # The page inlines the bootstrap itself (the proxy skips a response that already
  # carries the marker), so it exercises the bootstrap from the *checkout* rather
  # than from the orchestrator serving the preview. That's deliberate: a bootstrap
  # fix can be verified in production ShipIt before the orchestrator ships it.
  sdk-test:
    image: node:24-slim
    working_dir: /workspace
    init: true
    # tsx comes from the agent container's bind-mounted node_modules, populated by
    # `agent.install`; wait for it rather than racing that install (feature 137).
    command: >
      sh -c "
      while [ ! -x node_modules/.bin/tsx ]; do
        echo '[sdk-test] waiting for agent.install to populate node_modules…'; sleep 1;
      done &&
      exec node --import tsx test-preview/server.ts
      "
    environment:
      # Matches the production orchestrator's own loader, so the injected
      # bootstrap here is transpiled exactly the way production transpiles it.
      PORT: "3002"
    volumes:
      - .:/workspace
    ports:
      - "3002:3002"
    x-shipit-preview: manual

  # Android emulator preview — dogfoods docs/213's interactive-preview tier on
  # the in-repo native test app (`android-snapshot-test/`). The old `android/`
  # WebView wrapper was removed (superseded by the PWA, docs/222); the test app
  # is now the canonical Android target for build, snapshot, and preview.
  # Marked `manual` like `dev`: it's heavy (~2–4 GiB + a booting Android OS) and
  # needs host KVM, so it boots only when the user explicitly starts it, never on
  # every session.
  #
  # Once started, the outer preview proxy routes `<sessionId>--6080.localhost` to
  # the container's noVNC web UI and renders it in the preview pane. The agent
  # reaches adb on the Compose network by service DNS: `adb connect emulator:5555`.
  #
  # The emulator boots a BLANK device — it doesn't know about our app. The
  # `android` service below builds the APK, installs it, and hot-reloads it on
  # change. `depends_on: [android]` makes starting this preview bring that builder
  # up too (compose `up emulator` starts its dependencies), so the user clicks one
  # thing and the app appears — like the web `dev` service. (The reverse edge —
  # `android` needing the device — is handled by polling adb in the build script,
  # not a depends_on, to avoid a dependency cycle.)
  #
  # Requires `/dev/kvm` on the outer host (verify with `kvm-ok`) and that the
  # deployment hasn't disabled the device passthrough (`SESSION_ALLOW_DEV_KVM=0`).
  # `/dev/kvm:/dev/kvm` is the only `devices:` mapping ShipIt's compose generator
  # permits. No KVM → use a cloud device farm instead (the emulator is too slow).
  emulator:
    image: budtmo/docker-android:emulator_14.0
    # REQUIRED. ShipIt otherwise runs every compose service as the session-worker
    # UID (docs/150 §7) so dev-server writes into the shared workspace stay
    # agent-owned. This image ships its own unprivileged user and keeps its
    # startup scripts under /home/androidusr, which that UID cannot execute:
    #   sh: /home/androidusr/docker-android/mixins/scripts/run.sh: Permission denied
    # Declaring `user:` explicitly is honored verbatim by the compose generator
    # (it never overrides a deliberate choice), so the image starts as intended.
    # Nothing here writes to the shared workspace, so the UID-matching rationale
    # doesn't apply.
    user: androidusr
    environment:
      # REQUIRED — without WEB_VNC the image boots the emulator (adb works) but
      # never starts the noVNC web server, so the preview pane stays blank.
      - WEB_VNC=true
      - EMULATOR_DEVICE=Samsung Galaxy S10
    devices:
      - "/dev/kvm:/dev/kvm"
    ports:
      # ports[0] is preview metadata — the container port x-shipit-preview renders
      # (the noVNC web UI). Host bindings are stripped; routing is via the proxy.
      - "6080:6080"
    expose:
      # adb, reachable on the Compose network by service name (not host-published).
      - "5555"
    depends_on:
      - android
    x-shipit-preview: manual

  # Android build + hot-reload service — the Android analog of the web `dev`
  # service. Holds the SDK + Gradle (docker/Dockerfile.android-dev); it builds the
  # `android-snapshot-test/` debug APK, installs it onto `emulator` over adb, and
  # then watches the source tree and rebuilds + reinstalls + relaunches on every
  # change. That's the "hot reload" loop — coarser than web HMR (a full rebuild +
  # reinstall, not a code hot-swap, because native Android has no headless
  # hot-swap), but it keeps the preview reflecting the current code with no agent.
  #
  # No `x-shipit-preview` marker: this is a worker, not a previewable surface. It
  # starts because `emulator` depends_on it (see above). The build runs only when
  # the user opens the emulator preview — it does NOT tax normal web sessions
  # (which is why the APK build lives here and not in `agent.install`).
  android:
    build:
      context: .
      dockerfile: docker/Dockerfile.android-dev
    image: shipit-android-dev:local
    working_dir: /workspace/android-snapshot-test
    init: true
    # Unlike `emulator` above, this service deliberately KEEPS ShipIt's
    # session-worker UID: it writes Gradle build output into the shared workspace,
    # so matching the agent's UID is exactly what we want (docs/150 §7). But that
    # UID has no home directory inside this image, and both Gradle and adb need a
    # writable HOME for their caches/keys — so point them at the (UID-owned)
    # workspace instead of a root-owned `/`. Both dirs are gitignored.
    environment:
      HOME: /workspace/.android-home
      GRADLE_USER_HOME: /workspace/.gradle-android
    volumes:
      # Live source (the build reads it; the watch loop reacts to edits) + the
      # APK output the install step reads. Shared with the outer workspace.
      - .:/workspace
    command: ["bash", "/workspace/docker/android-hot-reload.sh"]
