name: shipit-prod

services:
  shipit:
    build:
      context: ../../..
      dockerfile: docker/Dockerfile.prod
      args:
        SHIPIT_HARNESSES: ${SHIPIT_HARNESSES:-}
        # Without it the image cannot say which commit it was built from, and
        # the running version falls back to whatever the checkout is at now —
        # so a failed update reads as a performed one (docs/304). The VPS path
        # has always passed this; the local ones now do too.
        SHIPIT_BUILD_ID: ${SHIPIT_BUILD_ID:-}
    # The orchestrator is PID 1 in this container, and Node reaps only the children it spawned
    # itself — an adopted orphan (a git whose parent exited first) zombies for the process's life.
    # docker-init reaps them; session containers do the same (planning#613).
    init: true
    # CFS fairness is per-CPU, so at the default weight the orchestrator's single main thread gets
    # only its even share against dozens of runnable worker threads — HTTP and WS upgrades stall for
    # seconds and every session switch shows "Reconnecting to server". Workers run at 512 (docs/229).
    cpu_shares: 4096
    # Keep loopback as the default: this service has no built-in authentication.
    ports:
      - "${SHIPIT_BIND_ADDR:-127.0.0.1}:4123:4123"
      - "${SHIPIT_BIND_ADDR:-127.0.0.1}:4124:5173"
    volumes:
      - workspace:/workspace
      - credentials:/credentials
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../..:/opt/shipit
    environment:
      - NODE_ENV=production
      - PORT=4123
      - USE_CONTAINERS=true
      - SHIPIT_SESSION_WORKER_UID=1000
      - AGENT_HOME=/home/shipit
      - WORKSPACE_VOLUME=shipit-prod_workspace
      - CREDENTIALS_VOLUME=shipit-prod_credentials
      - DOCKER_NETWORK=shipit-prod
      - SESSION_WORKER_IMAGE=shipit-session-worker:prod
      - DOCKER_STACK=shipit-prod
      - SHIPIT_DEPLOYMENT=local
      - SESSION_EGRESS_SIDECAR_IMAGE=shipit-egress-sidecar:prod
      - SESSION_EGRESS_ENFORCE=${SESSION_EGRESS_ENFORCE:-}
      - SHIPIT_ALLOWED_ORIGINS=${SHIPIT_ALLOWED_ORIGINS:-}
    networks:
      - shipit-prod

  session-worker:
    build:
      context: ../../..
      dockerfile: docker/Dockerfile.session-worker.prod
      args:
        SHIPIT_HARNESSES: ${SHIPIT_HARNESSES:-}
    image: shipit-session-worker:prod
    profiles:
      - build-only

  egress-sidecar:
    build:
      context: ../..
      dockerfile: Dockerfile.egress-sidecar
    image: shipit-egress-sidecar:prod
    profiles:
      - build-only

networks:
  shipit-prod:
    name: shipit-prod
    driver: bridge

volumes:
  workspace:
  credentials:
