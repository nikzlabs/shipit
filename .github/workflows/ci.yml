name: CI

on:
  pull_request:
    branches: [main, stable]
    # Required checks must use job-level skips; paths-ignore leaves them pending.
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
      egress: ${{ steps.filter.outputs.egress }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "Not a pull request — running the full gates."
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "egress=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Compare PR endpoints, not GitHub's synthetic merge commit.
          changed=$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA")
          echo "Changed files:"
          echo "$changed"
          if [ -z "$changed" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$changed" | grep -qvE '(^docs/|\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          # Include UID sources because the image contract reads them below.
          if printf '%s\n' "$changed" | grep -qE '^(docker/Dockerfile\.egress-sidecar|src/server/orchestrator/egress-dns\.ts|src/server/orchestrator/egress-proxy-install\.ts|\.github/workflows/ci\.yml)$|^docker/egress-sidecar/'; then
            echo "egress=true" >> "$GITHUB_OUTPUT"
          else
            echo "egress=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Lint, Type Check & Build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v5
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-ubuntu24-node24-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Validate agent CLI lockfile
        working-directory: docker/agent-cli
        run: |
          npm ci --ignore-scripts --dry-run || {
            status=$?
            echo '::error title=Agent CLI lockfile validation failed::See the npm error above. For missing optional platform records on a Renovate PR, wait until those platform releases are at least seven days old, then request Renovate rebase/retry to regenerate the lockfile.'
            echo 'If repair is still needed, run from the repository root:'
            echo '  npm install --package-lock-only --ignore-scripts --min-release-age=7 --prefix docker/agent-cli'
            echo '  npm ci --ignore-scripts --dry-run --prefix docker/agent-cli'
            echo 'Review the lockfile change before saving it. A later Renovate rebase can discard a manual repair.'
            echo 'See docs/141-cli-version-strategy/plan.md, Axis 2.'
            exit "$status"
          }
      # The runner has far more RAM than a session container, so the full lint gets the heap it
      # needs; 3072 GC-thrashed for 140 s and then exhausted the heap. See docs in CLAUDE.md.
      - run: npm run lint
        env:
          LINT_HEAP_MB: 6144
      - run: npm run typecheck
      - run: npm run check-deps
      - run: npm run check-audit
      - run: npm run build

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v5
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-ubuntu24-node24-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm test

  # Assert the privileged egress image contract, including orchestrator UIDs.
  egress-sidecar-image:
    name: Egress Sidecar Image
    needs: changes
    if: needs.changes.outputs.egress == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build the sidecar image
        run: docker build -f docker/Dockerfile.egress-sidecar -t shipit-egress-sidecar:ci docker/
      - name: Verify the image's default entrypoint and user
        run: |
          set -euo pipefail
          # Tier A depends on the image's default entrypoint to install containment.
          entrypoint=$(docker image inspect shipit-egress-sidecar:ci --format '{{json .Config.Entrypoint}}')
          echo "default entrypoint: $entrypoint"
          if [ "$entrypoint" != '["/usr/local/bin/init-firewall.sh"]' ]; then
            echo "Unexpected default entrypoint — Tier A installs containment through it." >&2
            echo "See installEgressFirewall() in src/server/orchestrator/egress-firewall-install.ts." >&2
            exit 1
          fi
          # Tier A needs root for NET_ADMIN.
          user=$(docker image inspect shipit-egress-sidecar:ci --format '{{.Config.User}}')
          if [ -n "$user" ]; then
            echo "Image sets a default USER ('$user'); Tier A's installer expects root." >&2
            exit 1
          fi
          echo "default user: root (unset), as Tier A requires"
      - name: Verify the image's contract with the orchestrator
        run: |
          set -euo pipefail
          # Read expected UIDs from their source of truth.
          resolver_uid=$(sed -n 's/^export const EGRESS_RESOLVER_UID = \([0-9]*\);.*/\1/p' src/server/orchestrator/egress-dns.ts)
          proxy_uid=$(sed -n 's/^export const EGRESS_PROXY_UID = \([0-9]*\);.*/\1/p' src/server/orchestrator/egress-proxy-install.ts)
          if [ -z "$resolver_uid" ] || [ -z "$proxy_uid" ]; then
            echo "Could not read EGRESS_RESOLVER_UID / EGRESS_PROXY_UID from the server source." >&2
            echo "If those constants were renamed or moved, update this step to match." >&2
            exit 1
          fi
          echo "orchestrator expects: resolver uid=$resolver_uid, proxy uid=$proxy_uid"
          docker run --rm \
            -v "$PWD/docker/egress-sidecar/image-checks.sh:/image-checks.sh:ro" \
            --entrypoint sh shipit-egress-sidecar:ci \
            /image-checks.sh "$resolver_uid" "$proxy_uid"
      # docs/319: the local block, installed in a real namespace, refuses what it must.
      - name: Verify the local block in a real network namespace
        run: |
          set -euo pipefail
          image=shipit-egress-sidecar:ci
          docker network create shipit-ci-block >/dev/null
          gw=$(docker network inspect shipit-ci-block --format '{{(index .IPAM.Config 0).Gateway}}')
          # A dropped UDP send fails at once with EPERM; a dropped TCP connect only hangs.
          refused() {
            local out
            out=$(docker run --rm --network container:shipit-ci-target --entrypoint bash "$image" \
              -c "timeout 3 bash -c 'exec 3<>/dev/udp/$1/$2 && echo probe >&3' 2>&1 || true")
            [[ "$out" == *"not permitted"* ]]
          }
          # Packets the SSH chain accepted: an accepted TCP connect leaves the namespace.
          ssh_accepts() {
            docker run --rm --network container:shipit-ci-target --entrypoint bash "$image" \
              -c "timeout 3 bash -c 'exec 3<>/dev/tcp/$1/$2' >/dev/null 2>&1 || true" >/dev/null
            docker run --rm --network container:shipit-ci-target --cap-add NET_ADMIN --entrypoint iptables "$image" \
              -L SHIPIT-SSH -v -x -n | awk -v d="$1" '$0 ~ d {print $1}' | head -n1
          }
          for policy in open contained; do
            docker run -d --name shipit-ci-target --network shipit-ci-block --entrypoint sleep "$image" 300 >/dev/null
            docker run --rm --network container:shipit-ci-target --cap-add NET_ADMIN \
              -e EGRESS_POLICY="$policy" \
              -e EGRESS_HOST_ADDRS="$(hostname -I)" \
              -e EGRESS_SSH_TARGETS="10.1.2.3:22" \
              -e EGRESS_LOCAL_TCP="10.9.9.9/32:4123" \
              -e EGRESS_ALLOWED_CIDRS="1.1.1.1/32 10.1.2.0/24" \
              "$image"
            for target in "$gw 22" "10.1.2.3 80" "100.64.0.1 80" "192.168.1.1 80" "169.254.169.254 80" \
                "$(hostname -I | awk '{print $1}') 22"; do
              if ! refused $target; then echo "$policy: $target was not refused"; exit 1; fi
            done
            accepted=$(ssh_accepts 10.1.2.3 22)
            if ! [ "${accepted:-0}" -gt 0 ] 2>/dev/null; then echo "$policy: the SSH destination's port was refused"; exit 1; fi
            out=$(docker run --rm --network container:shipit-ci-target --entrypoint bash "$image" \
              -c "timeout 5 bash -c 'exec 3<>/dev/tcp/1.1.1.1/443 && echo connected' 2>&1 || true")
            if [[ "$out" != *connected* ]]; then echo "$policy: an internet address did not connect: $out"; exit 1; fi
            if [ "$policy" = contained ] && ! refused 8.8.8.8 443; then
              echo "contained: an address outside the allowlist was not refused"; exit 1
            fi
            docker rm -f shipit-ci-target >/dev/null
            echo "$policy policy: ok"
          done
          docker run --rm --network none --cap-add NET_ADMIN --entrypoint /usr/local/bin/probe-firewall.sh "$image"
          docker network rm shipit-ci-block >/dev/null
      # A host drop from install time names an address Docker later gave to a session's service.
      - name: Verify a stale host drop does not hide a session's service
        run: |
          set -euo pipefail
          image=shipit-egress-sidecar:ci
          refused() {
            local out
            out=$(docker run --rm --network container:shipit-ci-agent --entrypoint bash "$image" \
              -c "timeout 3 bash -c 'exec 3<>/dev/udp/$1/$2 && echo probe >&3' 2>&1 || true")
            [[ "$out" == *"not permitted"* ]]
          }
          docker network create shipit-ci-agent-net >/dev/null
          docker network create --internal -o com.docker.network.bridge.inhibit_ipv4=true shipit-ci-session >/dev/null
          subnet=$(docker network inspect shipit-ci-session --format '{{(index .IPAM.Config 0).Subnet}}')
          docker run -d --name shipit-ci-service --network shipit-ci-session --entrypoint sleep "$image" 300 >/dev/null
          service=$(docker inspect shipit-ci-service --format '{{(index .NetworkSettings.Networks "shipit-ci-session").IPAddress}}')
          docker run -d --name shipit-ci-agent --network shipit-ci-agent-net --entrypoint sleep "$image" 300 >/dev/null
          docker run --rm --network container:shipit-ci-agent --cap-add NET_ADMIN \
            -e EGRESS_POLICY=open -e EGRESS_HOST_ADDRS="$(hostname -I) $service" "$image"
          docker network connect shipit-ci-session shipit-ci-agent
          if ! refused "$service" 3000; then echo "the install did not refuse $service"; exit 1; fi
          docker run --rm --network container:shipit-ci-agent --cap-add NET_ADMIN \
            --entrypoint /usr/local/bin/allow-subnet.sh \
            -e EGRESS_ALLOW_SUBNETS="$subnet" -e EGRESS_HOST_ADDRS="$(hostname -I)" "$image"
          if refused "$service" 3000; then echo "the session's service at $service is still refused"; exit 1; fi
          if ! refused "$(hostname -I | awk '{print $1}')" 22; then echo "the host is no longer refused"; exit 1; fi
          docker rm -f shipit-ci-agent shipit-ci-service >/dev/null
          docker network rm shipit-ci-session shipit-ci-agent-net >/dev/null
          echo "stale host drop: ok"
