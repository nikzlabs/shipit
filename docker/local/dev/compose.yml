name: shipit-dev

services:
  shipit:
    build:
      context: ../../..
      dockerfile: docker/Dockerfile.dev
    # PID 1 here is the entrypoint's `exec npm run dev`, which reaps adopted orphans no better than
    # node does — a git whose parent exited first zombies for the container's life. docker-init
    # reaps them; session containers do the same (planning#613).
    init: true
    # CFS fairness is per-CPU, so at the default weight the orchestrator's single main thread gets
    # only its even share against dozens of runnable worker threads — HTTP and WS upgrades stall for
    # seconds and every session switch shows "Reconnecting to server". Workers run at 512 (docs/229).
    cpu_shares: 4096
    ports:
      - "3000:3000"
      - "3001:3001"
      - "5173:5173"
    volumes:
      - ../../..:/app
      - node_modules:/app/node_modules
      - workspace:/workspace
      - credentials:/credentials
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PORT=3001
      - CLIENT_DEV_PORT=3000
      - VITE_API_HOST=localhost:3001
      # Vite runs in this container and proxies /api and /ws to the orchestrator over
      # loopback, so trust the orchestrator's own loopback here (planning#668). Only the
      # single-container dev stack needs this; prod serves the client statically.
      - SHIPIT_TRUST_OWN_LOOPBACK=1
      - USE_CONTAINERS=true
      - SHIPIT_SESSION_WORKER_UID=1000
      - AGENT_HOME=/home/shipit
      - WORKSPACE_VOLUME=shipit-dev_workspace
      - CREDENTIALS_VOLUME=shipit-dev_credentials
      - DOCKER_NETWORK=shipit-dev
      - SESSION_WORKER_IMAGE=shipit-session-worker:dev
      - SESSION_WORKER_DOCKER_IMAGE=shipit-session-worker:docker-dev
      - DOCKER_STACK=shipit-dev
      - OVERLAY_DEP_STORE=${OVERLAY_DEP_STORE:-}
      - SHIPIT_ORCHESTRATOR_HOST=shipit
      - SHIPIT_ORCHESTRATOR_FALLBACK_HOSTS=shipit
      - SESSION_EGRESS_SIDECAR_IMAGE=shipit-egress-sidecar:dev
      - SESSION_COMPOSE_HELPER_IMAGE=shipit-compose-helper:dev
      - SESSION_EGRESS_ENFORCE=${SESSION_EGRESS_ENFORCE:-}
      - SESSION_SECCOMP=${SESSION_SECCOMP:-}
      - SESSION_SECCOMP_PROFILE=${SESSION_SECCOMP_PROFILE:-}
      - SESSION_READONLY_ROOTFS=${SESSION_READONLY_ROOTFS:-}
      - SESSION_RUNTIME=${SESSION_RUNTIME:-}
    networks:
      - shipit-dev

  session-worker:
    build:
      context: ../../..
      dockerfile: docker/Dockerfile.session-worker.dev
    image: shipit-session-worker:dev
    profiles:
      - build-only

  egress-sidecar:
    build:
      context: ../..
      dockerfile: Dockerfile.egress-sidecar
    image: shipit-egress-sidecar:dev
    profiles:
      - build-only

  # Runs the Compose commands that read a session's project files (docs/318).
  compose-helper:
    build:
      context: ../..
      dockerfile: Dockerfile.compose-helper
    image: shipit-compose-helper:dev
    profiles:
      - build-only

  # Ops and Docker-access sessions run this image (docs/128). Build after session-worker
  # without --pull; its base image is local-only. Its tag differs from the prod stacks'
  # so both can share one daemon.
  session-worker-docker:
    build:
      context: ../../..
      dockerfile: docker/Dockerfile.session-worker.docker
      args:
        BASE_IMAGE: shipit-session-worker:dev
    image: shipit-session-worker:docker-dev
    profiles:
      - build-only

networks:
  shipit-dev:
    name: shipit-dev
    driver: bridge

volumes:
  node_modules:
  workspace:
  credentials:
