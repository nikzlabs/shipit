<!doctype html>
<meta charset="utf-8">
<title>idle frame cost</title>
<style>
  @keyframes spin-slow { to { transform: rotate(360deg); } }
  @keyframes slide-left { to { left: 40px; } }
  .tool-spinner { animation: spin-slow 1s linear infinite; }
  .tool-spinner.steps8 { animation-timing-function: steps(8); }
  .tool-spinner.steps { animation-timing-function: steps(var(--steps)); }
  .tool-spinner.slow { animation-duration: 8s; }
  .tool-spinner.nonComp { position: relative; animation-name: slide-left; }
  .sp { display: inline-block; width: 12px; height: 12px; border: 1px solid #39f;
        border-top-color: transparent; border-radius: 9999px; }
  body { font: 13px system-ui; margin: 0; padding: 8px; }
  .row { padding: 6px 8px; border-bottom: 1px solid #eee; }
  .cv > * { content-visibility: auto; contain-intrinsic-size: auto 5rem; }
  #promoted { position: fixed; inset: 0; pointer-events: none; }
  #promoted > i { position: absolute; width: 6px; height: 6px; background: #0c0;
                  will-change: transform; }
</style>
<body>
  <div><span id="spin" class="sp"></span> <span id="spin2" class="sp"></span> <span id="label"></span></div>
  <div id="list"></div>
  <script>
    const q = new URLSearchParams(location.search);
    const rows = Number(q.get("n") ?? 0);
    const list = document.getElementById("list");

    if (q.get("spin") === "1") {
      document.getElementById("spin").classList.add("tool-spinner");
      const mode = q.get("spinmode");
      if (mode) document.getElementById("spin").classList.add(mode);
      const steps = q.get("steps");
      if (steps) {
        document.getElementById("spin").classList.add("steps");
        document.getElementById("spin").style.setProperty("--steps", steps);
      }
    }

    const second = q.get("second");
    if (second) {
      // Staggering tests independent animation step boundaries.
      const offset = Number(q.get("secondOffsetMs") ?? 0);
      const start = () => {
        const el = document.getElementById("spin2");
        el.classList.add("tool-spinner");
        if (second !== "linear") {
          el.classList.add("steps");
          el.style.setProperty("--steps", second);
        }
      };
      if (offset > 0) setTimeout(start, offset); else start();
    }
    if (q.get("cv") === "1") list.className = "cv";

    for (let i = 0; i < rows; i++) {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `<b>msg ${i}</b><p>${"lorem ipsum dolor sit amet ".repeat(6)}</p><pre>code line</pre>`;
      list.appendChild(row);
    }

    // Keep promoted layers visible and separate.
    const promote = Number(q.get("promote") ?? 0);
    if (promote > 0) {
      const holder = document.createElement("div");
      holder.id = "promoted";
      const perRow = Math.ceil(Math.sqrt(promote));
      for (let i = 0; i < promote; i++) {
        const box = document.createElement("i");
        box.style.left = `${(i % perRow) * (100 / perRow)}%`;
        box.style.top = `${Math.floor(i / perRow) * (100 / perRow)}%`;
        holder.appendChild(box);
      }
      document.body.appendChild(holder);
    }

    // Paint chunks without compositing are the negative control.
    const chunk = Number(q.get("chunk") ?? 0);
    if (chunk > 0) {
      const mode = q.get("chunkmode") ?? "opacity";
      const holder = document.createElement("div");
      holder.id = "promoted";
      const perRow = Math.ceil(Math.sqrt(chunk));
      for (let i = 0; i < chunk; i++) {
        const box = document.createElement("i");
        box.style.left = `${(i % perRow) * (100 / perRow)}%`;
        box.style.top = `${Math.floor(i / perRow) * (100 / perRow)}%`;
        box.style.willChange = "auto";
        if (mode === "filter") box.style.filter = "grayscale(0.01)";
        else if (mode === "mixblend") box.style.mixBlendMode = "multiply";
        else box.style.opacity = "0.99";
        holder.appendChild(box);
      }
      document.body.appendChild(holder);
    }

    if (q.get("io") === "1") new IntersectionObserver(() => {}).observe(list);

    document.getElementById("label").textContent =
      `spin=${q.get("spin") ?? 0} cv=${q.get("cv") ?? 0} io=${q.get("io") ?? 0} rows=${rows} promote=${promote}`;
  </script>
</body>
