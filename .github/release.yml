changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: 🚀 Features
      labels:
        - feature
        - enhancement
    - title: 🐛 Fixes
      labels:
        - bug
        - fix
    - title: 📝 Documentation
      labels:
        - documentation
        - docs
    - title: ⬆️ Dependencies
      labels:
        - dependencies
    - title: 🧰 Maintenance
      labels:
        - chore
        - refactor
        - ci
        - test
    # Keep the catch-all last.
    - title: Other Changes
      labels:
        - "*"
