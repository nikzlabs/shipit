# Production VPS stack. deploy.sh builds services in dependency order.

name: shipit

services:
  shipit:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.prod
      args:
        # Must match the session-worker build argument below.
        SHIPIT_HARNESSES: ${SHIPIT_HARNESSES:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:4123:4123"
      - "127.0.0.1:5173:5173"
    volumes:
      - workspace:/workspace
      - credentials:/credentials
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/shipit:/opt/shipit
    environment:
      - NODE_ENV=production
      - PORT=4123
      - USE_CONTAINERS=true
      # Do not set HOME; the orchestrator needs its root OAuth home.
      - SHIPIT_SESSION_WORKER_UID=1000
      - AGENT_HOME=/home/shipit
      - WORKSPACE_VOLUME=shipit_workspace
      - CREDENTIALS_VOLUME=shipit_credentials
      - DOCKER_NETWORK=shipit
      - SESSION_WORKER_IMAGE=shipit-session-worker:prod
      - SESSION_WORKER_DOCKER_IMAGE=shipit-session-worker:docker
      - DOCKER_STACK=shipit
      # Use stable service DNS so sessions survive orchestrator replacement.
      - SHIPIT_ORCHESTRATOR_HOST=shipit
      - SHIPIT_ORCHESTRATOR_FALLBACK_HOSTS=shipit
      - DISK_JANITOR_COLD_ARTIFACT_RETENTION_DAYS=30
      - DISK_FREE_LOW_PCT=0.10
      - DISK_FREE_HIGH_PCT=0.20
      - DISK_IDLE_EVICT_MERGED_MS=172800000
      - SHIPIT_MANAGED_UPDATES=true
      - DEFAULT_SESSION_MEMORY_MB=${DEFAULT_SESSION_MEMORY_MB:-}
      - MAX_SESSION_MEMORY_MB=${MAX_SESSION_MEMORY_MB:-}
      - MAX_KEEP_PREVIEW_RUNNING=${MAX_KEEP_PREVIEW_RUNNING:-}
      - SHIPIT_ALLOWED_ORIGINS=${SHIPIT_ALLOWED_ORIGINS:-}
      - OVERLAY_DEP_STORE=${OVERLAY_DEP_STORE:-}
      - SHIPIT_GIT_LFS=${SHIPIT_GIT_LFS:-}
      - SHIPIT_GIT_LFS_TIMEOUT_MS=${SHIPIT_GIT_LFS_TIMEOUT_MS:-}
      - SHIPIT_GIT_LFS_SHARED_STORE=${SHIPIT_GIT_LFS_SHARED_STORE:-}
      - SHIPIT_GIT_LFS_CACHE_FETCH_TIMEOUT_MS=${SHIPIT_GIT_LFS_CACHE_FETCH_TIMEOUT_MS:-}
      - DISK_JANITOR_LFS_OBJECT_DAYS=${DISK_JANITOR_LFS_OBJECT_DAYS:-}
      # Containment fails closed unless the operator explicitly opts out.
      - SESSION_EGRESS_SIDECAR_IMAGE=shipit-egress-sidecar:prod
      - SESSION_EGRESS_ENFORCE=${SESSION_EGRESS_ENFORCE:-}
    networks:
      - shipit
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  session-worker:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.session-worker.prod
      args:
        SHIPIT_HARNESSES: ${SHIPIT_HARNESSES:-}
    image: shipit-session-worker:prod
    profiles:
      - build-only

  # Build-only image used for all egress containment tiers.
  egress-sidecar:
    build:
      context: ../../docker
      dockerfile: Dockerfile.egress-sidecar
    image: shipit-egress-sidecar:prod
    profiles:
      - build-only

  # Build after session-worker without --pull; its base image is local-only.
  session-worker-docker:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.session-worker.docker
      args:
        BASE_IMAGE: shipit-session-worker:prod
    image: shipit-session-worker:docker
    profiles:
      - build-only

networks:
  shipit:
    name: shipit
    driver: bridge

volumes:
  workspace:
  credentials:
